general {
    disable_loading_bar = true
}

background {
    monitor =
    path = ~/dotfiles/data/japanese_aesthetic.png
    color = rgba(0, 0, 0, 0)  # no global dim
}

# CLOCK
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    font_size = 80
    color = rgba(255, 255, 255, 1.0)

    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.8)

    position = 0, 100
    halign = center
    valign = center
}

# DATE (optional)
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    font_size = 24
    color = rgba(255, 255, 255, 0.8)

    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.7)

    position = 0, 30
    halign = center
    valign = center
}

# INPUT FIELD (clean but visible)
input-field {
    monitor =
    size = 260, 50
    outline_thickness = 2

    # subtle glass look
    inner_color = rgba(0, 0, 0, 0.25)
    outer_color = rgba(255, 255, 255, 0.25)
    font_color = rgba(255, 255, 255, 1.0)

    placeholder_text = Enter password...

    dots_size = 0.25
    dots_spacing = 0.3

    position = 0, -60
    halign = center
    valign = center
}
