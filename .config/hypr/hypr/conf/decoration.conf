decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 0.96
    dim_inactive = true
    dim_strength = 0.04

    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(1a1028aa)
    }
}

animations {
    enabled = yes

    bezier = soft, 0.05, 0.9, 0.1, 1.0

    animation = windows, 1, 7, soft, slide
    animation = windowsIn, 1, 7, soft, slide
    animation = windowsOut, 1, 6, soft, popin 80%
    animation = border, 1, 8, default
    animation = fade, 1, 6, default
    animation = workspaces, 1, 7, default, slidefade
}
